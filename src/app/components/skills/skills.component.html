<section id="skills" class="py-20 px-4 bg-gray-50 dark:bg-gray-900">
  <div class="container mx-auto max-w-6xl">
    <!-- Section Header -->
    <div class="text-center mb-16 animate-on-scroll">
      <h2 class="section-title">{{ 'skills.title' | t }}</h2>
      <p class="section-subtitle">
        {{ 'skills.subtitle' | t }}
      </p>
    </div>

    <!-- Skills by area (sin porcentajes) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-on-scroll">
      <div
        *ngFor="let category of skillCategories"
        class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-lg hover:shadow-xl transition-shadow duration-300">
        <h3 class="text-lg font-display font-semibold text-gray-900 dark:text-white mb-4">
          {{ category.name }}
        </h3>
        <ul class="flex flex-wrap gap-2">
          <li
            *ngFor="let skill of category.skills"
            class="px-3 py-1.5 bg-primary-50 dark:bg-primary-900/40 text-primary-700 dark:text-primary-300 rounded-full text-sm font-medium">
            {{ skill.name }}
          </li>
        </ul>
      </div>
    </div>

    <!-- Skills Summary: valores calculados desde los datos, con animación de conteo -->
    <div #statsGrid class="mt-16 grid grid-cols-2 md:grid-cols-4 gap-6 animate-on-scroll">
      <div *ngFor="let stat of stats" class="text-center p-6 md:p-8 bg-white dark:bg-gray-800 rounded-xl shadow-lg">
        <div class="w-14 h-14 bg-primary-100 dark:bg-primary-900 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-7 h-7 text-primary-600 dark:text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="stat.icon"/>
          </svg>
        </div>
        <p class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-2">+{{ stat.shown }}</p>
        <p class="text-sm md:text-base text-gray-600 dark:text-gray-400">{{ stat.label | t }}</p>
      </div>
    </div>
  </div>
</section>
